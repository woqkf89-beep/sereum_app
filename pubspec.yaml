name: sereum_app
description: A premium AI fortune telling app "관령이의 소름사주"
publish_to: 'none'
version: 1.0.0+1

environment:
  sdk: ">=2.18.0 <3.0.0"

dependencies:
  flutter:
    sdk: flutter
  cupertino_icons: ^1.0.2
  flutter_localizations:
    sdk: flutter
  provider: ^6.0.5
  shared_preferences: ^2.0.15
  http: ^1.6.0
  google_mobile_ads: ^2.3.0
  in_app_purchase: ^3.0.7
  animations: ^2.0.6
  flutter_spinkit: ^5.1.0
  flutter_svg: ^1.1.6
  intl: ^0.19.0
dev_dependencies:
  flutter_test:
    sdk: flutter
  flutter_lints: ^2.0.0

flutter:
  uses-material-design: true
  assets:
    - assets/i18n/
    - assets/icon/
    - assets/ui/